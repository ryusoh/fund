exclude: |
    ^\.claude/|
    ^fund/|
    ^assets/vendor/|
    ^js/vendor/|
    ^node_modules/|
    ^venv/|
    ^.mypy_cache/|
    ^.ruff_cache/|
    ^coverage/|
    ^dist/|
    ^build/|
    ^data/|
    ^ai/status/

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: end-of-file-fixer
            # Do not touch generated data files, AI status files, or
            # eslint-suppressions.json (rewritten by `eslint --prune-suppressions`
            # without a trailing newline; machine-managed, prettier-ignored).
            exclude: ^data/.*\.(csv|html|json|txt)$|^ai/status/|^js/vendor/|^eslint-suppressions\.json$
          - id: trailing-whitespace
            # Do not touch generated data files
            exclude: ^data/.*\.(csv|html|json|txt)$|^js/vendor/
          - id: mixed-line-ending
            # Do not touch generated data files
            exclude: ^data/.*\.(csv|html|json|txt)$
          - id: detect-private-key

    - repo: local
      hooks:
          - id: md-box-align
            name: md-box-align (Unicode box diagrams in Markdown)
            entry: bash -lc 'PY=venv/bin/python; [ -x "$PY" ] || PY=python3; "$PY" -m scripts.agents.check_md_boxes --fix "$@"' --
            language: system
            files: '\.md$'
            pass_filenames: true
          - id: md-latex-fix
            name: md-latex-fix (GitHub Markdown LaTeX formatting)
            entry: bash -lc 'PY=venv/bin/python; [ -x "$PY" ] || PY=python3; "$PY" -m scripts.agents.check_md_latex --fix "$@"' --
            language: system
            files: '\.md$'
            pass_filenames: true

    - repo: https://github.com/DavidAnson/markdownlint-cli2
      rev: v0.22.0
      hooks:
          - id: markdownlint-cli2
            args:
                [
                    '--config',
                    '.markdownlint.json',
                    '#**/node_modules/**',
                    '#venv/**',
                    '#.qwen/**',
                    '#.claude/**',
                ]

    # JavaScript tooling (commit): format + lint
    - repo: local
      hooks:
          - id: prettier
            name: prettier (staged files)
            entry: bash -lc 'BIN=./node_modules/.bin/prettier; if [ -x "$BIN" ]; then "$BIN" --write --cache --cache-location node_modules/.cache/prettiercache --ignore-path .prettierignore -- "$@"; elif command -v npx >/dev/null 2>&1; then npx --yes prettier --write --ignore-path .prettierignore -- "$@"; else echo "prettier/npx missing; skipping Prettier"; fi' --
            language: system
            files: '\.(js|css|json|yml|yaml|md|html)$'
            exclude: ^data/.*\.(html|json)$
            pass_filenames: true

    - repo: local
      hooks:
          - id: eslint
            name: eslint (staged JS)
            entry: bash -lc 'BIN=./node_modules/.bin/eslint; if [ -x "$BIN" ]; then "$BIN" --max-warnings=0 --no-warn-ignored -- "$@"; elif command -v npx >/dev/null 2>&1; then npx --yes eslint --max-warnings=0 --no-warn-ignored -- "$@"; else echo "eslint/npx missing; skipping ESLint"; fi' --
            language: system
            types_or: [javascript]
            pass_filenames: true

    - repo: local
      hooks:
          - id: stylelint
            name: stylelint (staged CSS)
            entry: bash -lc 'BIN=./node_modules/.bin/stylelint; if [ -x "$BIN" ]; then "$BIN" --cache --cache-location node_modules/.cache/stylelintcache --formatter=unix --config-basedir "$(pwd)" -- "$@"; elif command -v npx >/dev/null 2>&1; then npx --yes -p @stylistic/stylelint-plugin stylelint --formatter=unix --config-basedir "$(pwd)" -- "$@"; else echo "stylelint/npx missing; skipping Stylelint"; fi' --
            language: system
            types_or: [css]
            pass_filenames: true

    - repo: local
      hooks:
          - id: xenon-complexity
            name: xenon (Python complexity ratchet)
            entry: bash -lc 'PY=venv/bin/python; [ -x "$PY" ] || PY=python3; if ! "$PY" -c "import xenon" >/dev/null 2>&1; then echo "xenon missing; skipping"; exit 0; fi; "$PY" -m xenon --max-average C --max-modules F --max-absolute F scripts tests'
            language: system
            pass_filenames: false
            always_run: true

    - repo: local
      hooks:
          - id: dependency-cruiser
            name: dependency-cruiser (JS dependency structure)
            entry: bash -lc 'BIN=./node_modules/.bin/dependency-cruiser; if [ -x "$BIN" ]; then "$BIN" js sw.js worker/src --config .dependency-cruiser.cjs; elif command -v npx >/dev/null 2>&1; then npx --yes dependency-cruiser js sw.js worker/src --config .dependency-cruiser.cjs; else echo "dependency-cruiser/npx missing; skipping"; fi'
            language: system
            pass_filenames: false
            always_run: true

    # JS tests (commit): related tests only
    - repo: local
      hooks:
          - id: jest-related
            name: jest (related tests)
            entry: bash -lc 'if ! ls jest.config.* package.json >/dev/null 2>&1; then echo "No Jest config found, skipping"; exit 0; fi; BIN=./node_modules/.bin/jest; if [ -x "$BIN" ]; then if [ $# -gt 0 ]; then "$BIN" --findRelatedTests --passWithNoTests "$@"; else "$BIN" --passWithNoTests; fi; else if [ $# -gt 0 ]; then npx --yes jest --findRelatedTests --passWithNoTests "$@"; else npx --yes jest --passWithNoTests; fi; fi' --
            language: system
            types_or: [javascript]
            pass_filenames: true

    # Full test suites (push): JS + Python
    - repo: local
      hooks:
          - id: jest-full
            name: jest (full, pre-push)
            entry: bash -lc 'BIN=./node_modules/.bin/jest; if [ -x "$BIN" ]; then "$BIN" --ci --runInBand; else npx --yes jest --ci --runInBand; fi'
            language: system
            pass_filenames: false
            stages: [pre-push]

    - repo: local
      hooks:
          - id: pytest-full
            name: pytest (full, pre-push)
            entry: bash -lc 'pytest -q'
            language: system
            pass_filenames: false
            stages: [pre-push]

    # Remind to deploy Cloudflare Worker after commits that touch worker/
    - repo: local
      hooks:
          - id: worker-deploy-reminder
            name: worker deploy reminder
            entry: bash -c "echo && echo 'worker/ changed -- remember to run make deploy-worker' && echo"
            language: system
            pass_filenames: false
            stages: [post-commit]
            files: '^worker/'

    # Optional: mypy type check on commit (adjust paths as needed)
    - repo: https://github.com/pre-commit/mirrors-mypy
      rev: v1.18.2
      hooks:
          - id: mypy
            files: '^scripts/|^tests/python/'
            additional_dependencies: ['types-requests', 'types-pytz']
