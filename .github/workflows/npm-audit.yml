name: npm-audit

on:
    push:
        branches: [main]
    pull_request:
    schedule:
        # Staggered to 03:15 UTC so it doesn't align with the 30-minute fund data updates.
        - cron: '15 3 * * *'

jobs:
    audit:
        runs-on: ubuntu-latest
        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Run npm audit
              # Check for production vulnerabilities only (dev deps like test-exclude use vulnerable minimatch)
              # This is acceptable since it's dev-only tooling, not exposed in production
              run: npm audit --omit=dev --audit-level=high
            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
            - name: Run pip-audit
              # Baseline verified clean locally (pip-audit 2.9.0); fails the job on
              # any known vulnerability in requirements.txt / requirements-dev.txt.
              run: |
                  pip install pip-audit
                  pip-audit -r requirements.txt -r requirements-dev.txt
            - name: Run tests
              run: npm test
