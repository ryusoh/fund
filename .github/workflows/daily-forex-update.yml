name: Daily Forex Data Update

on:
    schedule:
        # Runs at 05:00 UTC every day. This time is chosen as it's typically
        # after US markets close and before European markets open, providing
        # a relatively stable daily rate.
        - cron: '0 5 * * *'
    workflow_dispatch: # Allows manual triggering from the Actions tab

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: true

permissions:
    contents: write # Required to commit changes back to the repository
    actions: write # Required to dispatch the Pages deploy workflow

jobs:
    fetch-and-commit-forex:
        runs-on: ubuntu-latest
        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  # Shallow fetch: nothing here reads history (data is fetched
                  # from upstream APIs) and pull --rebase auto-deepens a
                  # shallow clone to find a merge base (verified 2026-10-16),
                  # so the full ~1 GB history is never needed.
                  fetch-depth: 100

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.x' # Use a recent Python 3 version

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Fetch forex data
              run: python scripts/data/fetch_forex.py

            - name: Commit and push changes
              id: autocommit
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add data/fx_data.json data/fx_daily_rates.csv
                  if git diff --cached --quiet; then
                    echo 'No changes to commit.'
                  else
                    git commit -m "chore(data): 為替レートを自動更新 [skip ci]"
                    # Retry push with rebase in case another workflow pushed in the meantime
                    pushed=''
                    for i in 1 2 3; do
                      if git push; then
                        pushed=true
                        echo "changes_detected=true" >> "$GITHUB_OUTPUT"
                        break
                      fi
                      echo "Push failed (attempt $i), rebasing and retrying..."
                      git pull --rebase
                    done
                    if [ -z "$pushed" ]; then
                      echo 'Push failed after 3 attempts.'
                      exit 1
                    fi
                  fi

            # Bot pushes use GITHUB_TOKEN + [skip ci], so they never trigger the
            # push-based Pages deploy — dispatch it explicitly.
            - name: Trigger Pages deploy
              if: steps.autocommit.outputs.changes_detected == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh workflow run pages.yml --ref main
