name: TWRR Refresh

on:
    schedule:
        # Run at 21:15 UTC on weekdays (~1h15 after NYSE close) after other data jobs finish.
        - cron: '15 21 * * 1-5'
        # Safety net at 05:12 UTC Tue-Sat (~00:12 ET, past Yahoo's 20:00-23:30
        # ET daily-bar rollover window): rescues the day when the main run was
        # congestion-delayed into the window or failed for any other reason.
        # The precheck step skips this run when tonight's data is already
        # committed — the pipeline is not byte-idempotent, so a redundant run
        # must never execute.
        - cron: '12 5 * * 2-6'
    workflow_dispatch:

permissions:
    contents: write # Required to commit changes back to the repository
    actions: write # Required to dispatch the Pages deploy workflow

jobs:
    refresh:
        runs-on: ubuntu-latest
        env:
            PYTHON_VERSION: '3.11'
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  # Shallow fetch: full history is ~1 GB (daily regenerated data
                  # snapshots) and nothing here needs it — the pipeline
                  # regenerates data from upstream APIs, the precheck reads
                  # only the last 12 h of commit log, and push/pull --rebase
                  # work fine from a shallow clone. ~100 commits covers weeks
                  # at the current ~3 commits/day.
                  fetch-depth: 100

            # The safety-net cron must be a true no-op when the main run
            # already committed: a redundant full run is NOT idempotent,
            # because update_fund_data.py is Alpaca-first overnight and
            # yfinance-first at the 17:15 ET slot, and the two providers'
            # closes differ by cents — the rerun would commit a provider
            # flip-flop and dispatch Pages every night (verified locally
            # 2026-10-14). A matching bot data commit within the last 12h
            # means tonight's data already landed (validate gates commits,
            # so a landed commit implies valid data); the previous night's
            # safety-net commit is ~24h old and falls outside the window.
            - name: Skip if tonight's data is already committed
              id: precheck
              run: |
                  # Only the safety-net cron may skip — the main cron and
                  # manual dispatches always run the full pipeline.
                  if [ "${{ github.event.schedule }}" = '12 5 * * 2-6' ] && \
                     git log --since="12 hours ago" --grep="TWRRとファンドデータを自動更新" -1 --format=%H | grep -q .; then
                    echo 'Data commit found within the last 12 hours; skipping redundant run.'
                    echo 'skip=true' >> "$GITHUB_OUTPUT"
                  else
                    echo 'skip=false' >> "$GITHUB_OUTPUT"
                  fi

            - name: Set up Python
              if: steps.precheck.outputs.skip != 'true'
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install dependencies
              if: steps.precheck.outputs.skip != 'true'
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install -r requirements-dev.txt
                  pip install plotly kaleido pandas-datareader

            - name: Update fund price data
              if: steps.precheck.outputs.skip != 'true'
              env:
                  POLYGON_KEY: ${{ secrets.POLYGON_KEY }}
                  ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
                  ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
              run: |
                  python scripts/data/update_fund_data.py

            - name: Update historical portfolio data
              if: steps.precheck.outputs.skip != 'true'
              run: |
                  python scripts/pnl/update_daily_pnl.py

            - name: Run TWRR pipeline
              if: steps.precheck.outputs.skip != 'true'
              env:
                  SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
                  POLYGON_KEY: ${{ secrets.POLYGON_KEY }}
                  ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
                  ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
              run: |
                  make twrr-refresh

            # Gate the commit: a regenerated dataset that violates basic
            # invariants (e.g. a held ticker's price history wiped by a flaky
            # fetch — ANET, 2026-09-02) must fail the run, not be committed.
            - name: Validate generated data
              if: steps.precheck.outputs.skip != 'true'
              run: |
                  make twrr-validate

            - name: Commit outputs if changed
              if: steps.precheck.outputs.skip != 'true'
              id: autocommit
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add data/fund_data.json data/checkpoints data/daily_cash_flow.parquet data/daily_market_value.parquet data/historical_portfolio_values.csv data/historical_prices.parquet data/historical_prices.json data/historical_prices_overrides.parquet data/output data/twrr_series.parquet data/ticker_metadata.json data/yield_data.json
                  if git diff --cached --quiet; then
                    echo 'No changes to commit.'
                  else
                    git commit -m "chore(data): TWRRとファンドデータを自動更新 [skip ci]"
                    # Retry push with rebase in case another workflow pushed in the meantime
                    pushed=''
                    for i in 1 2 3; do
                      if git push; then
                        pushed=true
                        echo "pushed=true" >> "$GITHUB_OUTPUT"
                        break
                      fi
                      echo "Push failed (attempt $i), rebasing and retrying..."
                      git pull --rebase
                    done
                    if [ -z "$pushed" ]; then
                      echo 'Push failed after 3 attempts.'
                      exit 1
                    fi
                  fi

            # Bot pushes use GITHUB_TOKEN + [skip ci], so they never trigger the
            # push-based Pages deploy — dispatch it explicitly.
            - name: Trigger Pages deploy
              if: steps.precheck.outputs.skip != 'true' && steps.autocommit.outputs.pushed == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh workflow run pages.yml --ref main
