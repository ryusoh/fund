name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    web-ci:
        runs-on: ubuntu-latest
        env:
            NODE_VERSION: '24'
            PYTHON_VERSION: '3.12'
            RUN_PRECOMMIT: 'true'
            RUN_DEPLOY: 'false'
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  # Full history: the bot-PR-hygiene step inspects individual
                  # commits in origin/<base>..HEAD; a shallow checkout hides the
                  # branch commits behind the merge commit.
                  fetch-depth: 0
                  submodules: 'false'

            # Hard guard: unattended Jules routines historically opened empty PRs
            # in sibling repos when mis-detecting a "finalize" state. Fail fast
            # so an empty diff can never pass CI.
            - name: Reject empty pull request
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }} --depth=1
                  if git diff --quiet origin/${{ github.base_ref }}; then
                    echo "::error::PR contains no changes. Empty PRs are not allowed."
                    exit 1
                  fi

            # Machine enforcement of AGENTS.md non-negotiable #10 for bot-authored
            # commits (wording alone did not stop the 2026-08 zero-file Typist PRs
            # or sibling-repo anki#494's empty churn commits): fails on empty
            # commits, zero-content placeholder files, and test deletions in any
            # commit by google-labs-jules[bot]. Stdlib-only, so it runs on the
            # runner's system python3 before Setup Python.
            - name: Reject bot PR hygiene violations
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  git fetch --no-tags origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
                  python3 -m scripts.agents.check_bot_pr_hygiene --base "origin/${{ github.base_ref }}"

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  if [ -f requirements-dev.txt ]; then
                    pip install -r requirements-dev.txt
                  fi

            - name: Show versions
              run: |
                  node -v
                  npm -v
                  python -V
                  make --version

            - name: Install Node dependencies
              if: ${{ hashFiles('package.json') != '' }}
              run: npm ci

            # Single source of truth: Makefile precommit-fix target
            # Any new checks added locally must be added to 'make precommit-fix'
            - name: Run precommit-fix (single source of truth)
              if: ${{ env.RUN_PRECOMMIT == 'true' }}
              run: make precommit-fix

            # Browser smoke stays out of precommit-fix because it needs the
            # Playwright Chromium binary, which local runs may not have.
            - name: Install Chromium for page smoke test
              if: ${{ env.RUN_PRECOMMIT == 'true' }}
              run: npx playwright install chromium

            - name: Page smoke test
              if: ${{ env.RUN_PRECOMMIT == 'true' }}
              run: make smoke

            - name: Deploy (placeholder)
              if: ${{ env.RUN_DEPLOY == 'true' }}
              run: echo "Deploy step controlled by caller workflow"
