<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://cdn.bootcdn.net https://cdn.baomitu.com; font-src 'self' data: https://fonts.gstatic.com https://unpkg.com https://cdn.bootcdn.net https://cdn.baomitu.com; img-src 'self' data: blob:; connect-src 'self' https://api.lyeutsaon.com; media-src 'self'; frame-src 'none'; object-src 'none';"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark" />
        <meta name="theme-color" content="#000000" />
        <title>Lab</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../assets/vendor/css/font-awesome-4.7.0.min.css" />
        <link rel="stylesheet" href="../css/analysis-proto.css" />
    </head>

    <body>
        <canvas id="holo-bg"></canvas>

        <nav class="top-nav">
            <div class="site-nav-links" aria-label="Global Navigation">
                <a href="../" aria-label="Home"><i class="fa fa-home" aria-hidden="true"></i></a>
                <a href="../position/" aria-label="Position"
                    ><i class="fa fa-pie-chart" aria-hidden="true"></i
                ></a>
                <a href="../calendar/" aria-label="Calendar"
                    ><i class="fa fa-calendar" aria-hidden="true"></i
                ></a>
                <a href="../terminal/" aria-label="Terminal"
                    ><i class="fa fa-code" aria-hidden="true"></i
                ></a>
                <a href="./" class="active" aria-label="Lab"
                    ><i class="fa fa-flask" aria-hidden="true"></i
                ></a>
            </div>
            <div class="nav-divider"></div>
            <div class="ticker-list" id="tickerList" tabindex="0"></div>
            <div class="nav-divider"></div>
            <div class="summary-stats" id="summaryStats" tabindex="0" aria-live="polite"></div>
        </nav>

        <main class="lab-container">
            <!-- Analysis Stage -->
            <section class="analysis-stage">
                <section class="panel output-panel">
                    <div class="output-grid">
                        <div class="left-col">
                            <article class="scenario-block">
                                <div class="block-header">
                                    <h3>Scenario Outcomes</h3>
                                </div>
                                <div class="card-row" id="scenarioResults" aria-live="polite"></div>
                            </article>

                            <article class="value-card">
                                <h3>Value Bands</h3>
                                <dl id="valueBands" aria-live="polite"></dl>
                            </article>

                            <article class="kelly-card">
                                <div class="block-header">
                                    <h3>Kelly Growth Curve & Sizing</h3>
                                </div>
                                <canvas
                                    id="kellyCurveCanvas"
                                    width="600"
                                    height="200"
                                    style="width: 100%; border: var(--border-thin)"
                                    role="img"
                                    aria-label="Kelly Growth Rate Curve vs Allocation"
                                ></canvas>
                                <div
                                    id="kellyMetrics"
                                    style="display: flex; gap: 10px; flex-wrap: wrap"
                                    aria-live="polite"
                                ></div>
                            </article>

                            <article class="risk-sim">
                                <div
                                    class="block-header"
                                    style="
                                        display: flex;
                                        justify-content: space-between;
                                        align-items: center;
                                    "
                                >
                                    <h3>Monte Carlo Risk Simulation</h3>
                                </div>
                                <div
                                    style="
                                        display: flex;
                                        gap: 10px;
                                        margin-bottom: 15px;
                                        flex-wrap: wrap;
                                    "
                                >
                                    <button class="ticker-btn" id="btnRunMonteCarlo">
                                        Run 10k Paths
                                    </button>
                                </div>
                                <div style="display: grid; grid-template-columns: 1fr; gap: 20px">
                                    <canvas
                                        id="monteCarloCanvas"
                                        width="600"
                                        height="200"
                                        style="width: 100%; border: var(--border-thin)"
                                        role="img"
                                        aria-label="Monte Carlo Risk Simulation Chart"
                                    ></canvas>
                                    <div
                                        id="riskMetrics"
                                        style="
                                            display: flex;
                                            flex-direction: row;
                                            gap: 15px;
                                            flex-wrap: wrap;
                                        "
                                        aria-live="polite"
                                    >
                                        <!-- Metrics populated by JS -->
                                    </div>
                                </div>
                            </article>
                        </div>

                        <div class="right-col">
                            <article class="bayes-lab">
                                <div class="block-header">
                                    <h3>Belief State & Bayesian Record</h3>
                                </div>
                                <div
                                    class="belief-card"
                                    id="beliefStateCard"
                                    aria-live="polite"
                                ></div>

                                <div
                                    class="block-header"
                                    id="evidenceTimelineHeader"
                                    style="
                                        margin-top: 10px;
                                        display: flex;
                                        justify-content: space-between;
                                        align-items: center;
                                    "
                                >
                                    <h4
                                        style="
                                            margin: 0;
                                            font-size: 0.85rem;
                                            text-transform: uppercase;
                                            color: var(--text-muted);
                                        "
                                    >
                                        Verified Evidence Log (.jsonl)
                                    </h4>
                                </div>
                                <div
                                    class="timeline-container"
                                    id="evidenceTimeline"
                                    aria-live="polite"
                                ></div>

                                <div
                                    class="prediction-box"
                                    id="predictionsCard"
                                    aria-live="polite"
                                ></div>

                                <div
                                    class="decision-box"
                                    id="decisionJournalCard"
                                    aria-live="polite"
                                ></div>

                                <div class="sandbox-card" id="sandboxCard">
                                    <div
                                        style="
                                            display: flex;
                                            justify-content: space-between;
                                            align-items: center;
                                        "
                                    >
                                        <span class="sandbox-tag"
                                            >What-If Sandbox (Local Only)</span
                                        >
                                    </div>
                                    <div
                                        style="
                                            display: flex;
                                            gap: 10px;
                                            align-items: center;
                                            flex-wrap: wrap;
                                        "
                                    >
                                        <button class="ticker-btn" id="btnBayesBull">
                                            Bull Signal
                                        </button>
                                        <button class="ticker-btn" id="btnBayesBear">
                                            Bear Signal
                                        </button>
                                        <button
                                            class="ticker-btn"
                                            id="btnBayesReset"
                                            style="border-color: var(--accent)"
                                        >
                                            Reset
                                        </button>
                                    </div>
                                    <div
                                        id="bayesOutput"
                                        style="font-family: var(--font-mono); color: var(--ink)"
                                        aria-live="polite"
                                    ></div>
                                </div>
                            </article>
                        </div>
                    </div>
                </section>
            </section>
        </main>

        <script type="module" src="../js/pages/analysis/visuals.js"></script>
        <script type="module" src="../js/pages/analysis/lab.js"></script>
    </body>
</html>
